name: Deploy Fork
on:
  push:
    branches:
      - gesh-custom
  workflow_dispatch:
permissions: read-all
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.repository == 'iigeshii/holoprint'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
      - name: Build
        run: |
          npm ci -w pipeline
          npm run build -- -- --version="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
      - name: Upload files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
